; Dynamic Key Prompts for Dark Souls III — shows the keys you actually bound instead of gamepad buttons in prompts.

[General]
; 0 = the mod does nothing
Enabled=1
; 1 = more detailed DynamicKeyPrompts.log
Diagnostics=0

; icons - key / mouse icons (DynamicKeyPrompts\cache\ds3, written on first use)
; text  - key names as text, e.g. [E]
Style=icons

; Icon theme: dark (stone plate, bronze rim), minimal (frame only), silver
IconTheme=dark

; Which binding to show when an action has both a key and a mouse button:
;   auto / keyboard - the key if there is one, otherwise the mouse button
;   mouse           - the mouse button if there is one
;   both            - key and mouse button
Labels=auto

; ---- text style only
; How a key is shown. {0} is the key name, e.g. "[{0}]" -> [E]
Format=[{0}]
; Between keys of a stick / d-pad prompt when the names are longer than one letter
Separator=/
; Optional colour of the key label, RRGGBB (e.g. E0C080). Empty = normal text colour.
Color=
